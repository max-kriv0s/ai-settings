# Universal lifecycle hook policy

meta:
  schema_version: 1

pre_tool_use:
  enabled: true
  tools:
    - all
  guard: ai_settings/hooks/guards/secret_guard.py
  # Параметры регистрации хука у агента; в сам guard не попадают (см. generate.py::clean_section)
  timeout: 5
  status_message: Проверка вызова на утечку секретов и опасные команды
  read_guard:
    # deny_path_segments, deny_file_patterns, allow_environment_templates — из shared/secrets.yaml
    include: secrets

    order:
      - deny_path_segments
      - allow_environment_templates
      - deny_secret_file_patterns
      - allow_project_source_and_config_files
      - report_sensitive_content

    allow_extensions:
      - .go
      - .py
      - .ts
      - .js
      - .json
      - .yaml
      - .yml
      - .toml
      - .md

    allow_file_names:
      - Dockerfile
      - Taskfile.yml
      - go.mod
      - go.sum

  # Паттерны ниже матчатся по НОРМАЛИЗОВАННОМУ сегменту команды: строка разрезана по
  # `|`, `;`, `&&`, `$(...)`, с начала сняты sudo / uv run / FOO=bar, кавычки убраны.
  # Поэтому `^` означает «команда начинается с», и `grep -rn 'git push' docs/` не ловится.
  destructive_guard:
    filesystem_destruction:
      - '^rm\b'
      - '^find\b.*\s-delete\b'
      - '^find\b.*\s-exec\s+rm\b'
      - '^(shred|unlink)\b'
      - '>\s*/dev/sd[a-z]'

    git_destruction:
      - '^git\s+(?:-C\s+\S+\s+)?push\b'
      - '^git\s+reset\b.*--hard\b'
      - '^git\s+branch\s+-D\b'
      - '^git\s+filter-(branch|repo)\b'
      - '^git\s+clean\s+-[a-z]*f'
      - '^git\s+commit\b.*--no-verify\b'
      - '^git\s+commit\b.*--amend\b'

    secret_exfiltration:
      - '^curl\b.*\s-d\b.*(?:password|secret|token|api_key)='
      - '^wget\b.*--post-data=.*(?:password|secret|token)'

    # Агент не ставит пакеты — ни глобально, ни в проект. Зависимости объявляет человек.
    # `uv sync` и `uv run` разрешены: они разворачивают уже объявленное окружение.
    package_install:
      - '^(npm|yarn|pnpm)\s+(?:install|i|add|global)\b'
      - '^pip3?\s+install\b'
      - '^uv\s+(?:add|pip\s+install|tool\s+install)\b'
      - '^uv\s+run\b.*--with\b'
      - '^pipx\s+install\b'
      - '^(gem|cargo|go|brew)\s+install\b'

  # Не разрушают ничего, но раскрывают секреты или дают доступ наружу.
  blocked_commands:
    environment_dump:
      - '^(env|set|export)\s*$'
      - '^export\s+-p\b'
      - '^printenv\b'

    docker_config:
      - '^docker\s+compose\s+config\b'
      - '^docker-compose\s+config\b'

    ssh_access:
      - '^(ssh|scp|sftp|ssh-add|ssh-agent|ssh-keygen|ssh-copy-id)\b'
      - '\b(IdentityFile|IdentitiesOnly|SSH_AUTH_SOCK)\b'
      - '(ssh://|git@[^:\s]+:)'

  # Что агент собирается записать на диск. Проверяется ДО записи: PostToolUse файл
  # уже не вернёт. Секретный материал запрещён везде, упоминание ssh — только в том,
  # что нельзя запустить: документация и конфиги.
  write_guard:
    allow_mention_extensions:
      - .md
      - .yaml
      - .yml

    deny_content_patterns:
      - '\bssh\b'
      - '\bscp\b'
      - '\bsftp\b'

  # Откуда интерпретатор берёт код: файл и -m разрешены, аргумент и stdin — нет.
  # Шеллы здесь же: `curl x | bash` — это bash, читающий stdin, а `sh -c '...'` — inline-код.
  interpreter_guard:
    interpreters:
      - python
      - node
      - ruby
      - perl
      - bash
      - sh
      - zsh

    # Снимаются с начала сегмента, чтобы добраться до имени команды.
    wrappers:
      - uv run
      - poetry run
      - sudo
      - env

post_tool_use:
  enabled: true
  tools:
    - all
  guard: ai_settings/hooks/guards/secret_guard.py
  timeout: 5
  status_message: Проверка вывода на секреты
  sensitive_output_guard:
    indicators:
      - secret
      - token
      - api_key
      - private_key
      - password
      - credential
    behavior: Блокировать или редактировать значения; агент сообщает только путь и имя настройки.
