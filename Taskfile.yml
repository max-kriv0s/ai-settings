version: "3"

vars:
  UV_CACHE_DIR: .uv-cache
  GENERATE: scripts/generate.py
  SYNC: scripts/sync.py
  GUARD_TESTS: >-
    hooks/PreToolUse/command_guard/test_command_guard.py
    hooks/PreToolUse/write_guard/test_write_guard.py
    hooks/PostToolUse/output_guard/test_output_guard.py

tasks:
  generate:
    desc: "Generate managed code blocks from ai_settings."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.GENERATE}} apply

  generate-plan:
    desc: "Show the generated block diff and write *.test_generated.py without touching the guard."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.GENERATE}} plan

  generate-and-sync:
    desc: "Generate managed code blocks, then sync ai_settings."
    cmds:
      - task generate
      - task sync

  test:
    desc: "Run smoke checks of every guard against its live file."
    cmds:
      - for: {var: GUARD_TESTS}
        cmd: UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.ITEM}}

  test-plan:
    desc: "Regenerate preview guards and check them, leaving the live ones untouched."
    cmds:
      - task generate-plan
      - for: {var: GUARD_TESTS}
        cmd: UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.ITEM}} preview

  plan:
    desc: "Show ai_settings sync plan without applying changes."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.SYNC}} plan

  sync:
    desc: "Run ai_settings sync. Default: apply all. Usage: task sync -- [plan|apply|check] [all|agents|skills|permissions|mcp|plugins|hooks] [name]. Example: task sync -- apply skills obsidian-cli"
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.SYNC}} {{.CLI_ARGS}}
