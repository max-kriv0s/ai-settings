version: "3"

vars:
  UV_CACHE_DIR: .uv-cache
  GENERATE: scripts/generate.py
  SYNC: scripts/sync.py
  GUARD_TESTS: >-
    hooks/PreToolUse/command_guard/test_command_guard.py
    hooks/PreToolUse/script_guard/test_script_guard.py
    hooks/PreToolUse/write_guard/test_write_guard.py
    hooks/PostToolUse/output_guard/test_output_guard.py
  SYNC_TESTS: >-
    scripts/tools/test_codex_permissions.py
  TESTS: >-
    {{.GUARD_TESTS}}
    {{.SYNC_TESTS}}

tasks:
  lock:
    desc: "Resolve and update the dependency lockfile."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv lock

  generate:
    desc: "Generate managed code blocks in every guard from its yaml."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.GENERATE}} apply

  generate-plan:
    desc: "Show the generated block diff and write *.test_generated.py without touching the guard."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.GENERATE}} plan

  generate-and-sync:
    desc: "Generate managed code blocks, then sync."
    cmds:
      - task generate
      - task sync

  test:
    desc: "Проверить guard-ы. Без аргумента — все, иначе только указанные файлы. Пример: task test -- hooks/PreToolUse/write_guard/test_write_guard.py"
    vars:
      TARGETS: '{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.TESTS}}{{end}}'
    cmds:
      - for: { var: TARGETS }
        cmd: |
          echo "→ {{.ITEM}}"
          UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.ITEM}}

  test-chain:
    desc: "Прогнать вызовы через все включённые guard-ы в порядке регистрации."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B hooks/test_chain.py

  test-plan:
    desc: "То же на превью-guard-ах, боевые не трогаются. Без аргумента — все файлы, иначе указанные."
    vars:
      TARGETS: '{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.TESTS}}{{end}}'
    cmds:
      - task generate-plan
      - for: { var: TARGETS }
        cmd: |
          echo "→ {{.ITEM}}"
          UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.ITEM}} preview

  format:
    desc: "Format Python sources."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run ruff format .

  lint:
    desc: "Lint Python sources."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run ruff check .

  format-and-lint:
    desc: "Fix, format, and lint Python sources."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run ruff check --fix .
      - task format
      - task lint

  plan:
    desc: "Show the sync plan without applying changes."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.SYNC}} plan

  sync:
    desc: "Apply the sync. Usage: task sync -- [plan|apply]; without an argument applies."
    cmds:
      - UV_CACHE_DIR={{.UV_CACHE_DIR}} uv run python -B {{.SYNC}} {{.CLI_ARGS}}
