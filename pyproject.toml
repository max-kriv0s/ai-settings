[project]
name = "ai-settings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tomlkit>=0.13.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
exclude = ["backup"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
