# Команды, которые только показывают текст и ничего не исполняют.
#
# Нужен двум guard-ам: script_guard не считает их аргумент скриптом, а output_guard
# не проверяет их вывод на имена файлов — иначе чтение собственных конфигов шумит.

read_commands:
  - cat
  - sed
  - grep
  - rg
  - head
  - tail
