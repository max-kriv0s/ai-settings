# Как разрезать командную строку на самостоятельные команды.
#
# Нужен двум guard-ам: command_guard проверяет каждый сегмент своими паттернами, а
# script_guard ищет в них запускаемый файл. Пока список был только у первого,
# `cd x && python3 y.py` проходил мимо второго — вся команда выглядела как `cd`.
#
# Обычные скобки разделителем НЕ являются: в сообщениях коммитов они встречаются
# чаще, чем в подстановках, и текст в скобках не должен выглядеть как команда.

segment_separator: '\|\||&&|[|;&\n\r]|\$\(|<\(|`'
