# Чем запускают код из файла. Подмешивается по `include: interpreters`.
#
# Нужен двум guard-ам сразу: command_guard решает, откуда интерпретатор берёт код,
# а script_guard — какой токен команды является запускаемым файлом. Список должен
# быть один, иначе guard-ы разойдутся и появится щель между ними.

names:
  - python
  - node
  - ruby
  - perl
  - bash
  - sh
  - zsh

# У шеллов код передаётся только через -c: их `-e` — это errexit, а не код.
shells:
  - bash
  - sh
  - zsh

# Читают файл и ничего не исполняют: `source x` и `. x` выполняют его в текущем шелле.
launchers:
  - source
  - "."
