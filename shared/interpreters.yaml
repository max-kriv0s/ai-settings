# Чем запускают код из файла. Подмешивается по `include: interpreters`.
#
# Нужен двум guard-ам сразу: command_guard решает, откуда интерпретатор берёт код,
# а script_guard — какой токен команды является запускаемым файлом. Список должен
# быть один, иначе guard-ы разойдутся и появится щель между ними.

names:
  - python
  - node
  - ruby
  - perl
  - bash
  - sh
  - zsh

# У шеллов код передаётся только через -c: их `-e` — это errexit, а не код.
shells:
  - bash
  - sh
  - zsh

# Читают файл и ничего не исполняют: `source x` и `. x` выполняют его в текущем шелле.
launchers:
  - source
  - "."

# Снимаются с начала команды, чтобы добраться до настоящего имени: `uv run python x.py`
# — это python. Сюда же ключевые слова шелла: `do python3 $f` в теле цикла — тоже python.
# Список по своей природе неполон: чего в нём нет, то обёртку не снимет.
wrappers:
  - uv run
  - poetry run
  - sudo
  - env
  - timeout
  - nohup
  - nice
  - xargs
  - command
  - exec
  - time
  - do
  - then
  - else

# Флаги обёрток, забирающие следующий токен: без этого `sudo -u deploy python x.py`
# оставляет первым токеном `deploy`, и команда уезжает с позиции 0.
wrapper_valued_flags:
  - -u
  - -I
  - -s
  - -n
  - -g
  - --user
  - --signal
