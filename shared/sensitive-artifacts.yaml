# Единый источник правды о том, что считается секретом.
#
# Подмешивается в любую секцию, где стоит `include: secrets`: секции `paths` у
# command_guard, script_guard и output_guard, а также `read_policy` в
# `permissions/policy.yaml`, откуда синк берёт deny-правила Claude Code.
# Ключи, заданные в самой секции, имеют приоритет над этим файлом.

deny_path_segments:
  - .ssh
  - ssh

deny_file_patterns:
  - .env
  - .env.*
  - "*.local.*"
  - "*.secret"
  - "*.secrets"
  - "*.pem"
  - credentials
  - credentials.json
  - credentials.yaml
  - credentials.yml
  - .netrc
  - .pgpass

# Файл-пример по определению не содержит значений, поэтому разрешён целиком.
allow_environment_templates:
  - "*.example"
