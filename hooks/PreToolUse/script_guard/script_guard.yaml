meta:
  schema_version: 1

script_guard:
  enabled: true
  tools: [all]
  guard: hooks/PreToolUse/script_guard/script_guard.py
  event: PreToolUse
  matcher: "*"
  timeout: 5
  status_message: Проверка запускаемого скрипта
  paths:
    include: shared/sensitive-artifacts.yaml

  # segment_separator — чем командная строка режется на отдельные команды
  syntax:
    include: shared/command-syntax.yaml

  # names, shells, launchers — чем запускают файл с кодом
  interpreters:
    include: shared/interpreters.yaml

  # read_commands — их аргумент показывают, а не исполняют
  commands:
    include: shared/read-commands.yaml

  execution:
    # Сколько байт скрипта читать. Большой файл не запрещается: проверяется начало.
    max_bytes: 262144
